[project]
name = "rag-knowledge-agent"
version = "0.1.0"
description = "文档知识库问答与工具 Agent：RAG、来源管理、LangGraph 与 FastAPI"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "chromadb>=1.5.9",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "langchain-openai>=1.7.2",
    "langgraph>=1.2.16",
    "openai>=3.14.0",
    "pypdf>=6.19.0",
    "python-dotenv>=1.2.3",
    "python-multipart>=0.0.32",
    "uvicorn>=0.53.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = ["pytest>=9.2.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
